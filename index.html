<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B4B43">
  <meta name="description" content="Interne Themenverteilung für BeGuNa">
  <title>BeGuNa – Themen sichern</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF6EF;
      --surface: #FFFFFF;
      --ink: #2B2622;
      --ink-soft: #6B6258;
      --teal: #1B4B43;
      --teal-dark: #123932;
      --amber: #E29A3C;
      --amber-dark: #C27F26;
      --rust: #B85C55;
      --rust-bg: #F5E4E1;
      --green-bg: #EAF3EC;
      --line: #E9E1D3;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(43, 38, 34, .07);
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Public Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: 0 0 calc(60px + env(safe-area-inset-bottom));
    }

    header {
      position: relative;
      overflow: hidden;
      padding: calc(28px + env(safe-area-inset-top)) 20px 28px;
      border-radius: 0 0 28px 28px;
      background: var(--teal);
      color: #F4EFE4;
    }

    header::after {
      content: "";
      position: absolute;
      right: -42px;
      top: -42px;
      width: 172px;
      height: 172px;
      border-radius: 50%;
      background: rgba(226, 154, 60, .2);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #C9DED9;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, h3, h4 {
      font-family: "Fraunces", serif;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 9px;
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 600;
      line-height: 1.08;
    }

    header p:last-child {
      position: relative;
      z-index: 1;
      max-width: 48ch;
      margin: 0;
      color: #DCE9E5;
      font-size: 14px;
      line-height: 1.5;
    }

    main { padding: 20px; }

    .topic {
      margin-bottom: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .topic-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .topic h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
    }

    .badge {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge.frei { background: var(--green-bg); color: var(--teal); }
    .badge.blockiert { background: var(--rust-bg); color: var(--rust); }

    .meta {
      display: grid;
      gap: 7px;
      margin: 14px 0;
      padding: 12px;
      border-radius: 12px;
      background: #FCFAF5;
      color: var(--ink-soft);
      font-size: 13.5px;
      line-height: 1.45;
    }

    .meta-row { display: flex; align-items: flex-start; gap: 8px; }
    .meta-icon { width: 18px; flex: 0 0 18px; text-align: center; }
    .meta strong { color: var(--ink); }
    .meta a { color: var(--teal); font-weight: 600; }

    .script-label {
      margin: 14px 0 6px;
      color: var(--teal);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .script-text {
      margin: 0 0 15px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .claim-row { display: flex; gap: 8px; }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 12px;
      background: #FCFAF5;
      color: var(--ink);
      font-size: 16px;
    }

    input:focus, textarea:focus {
      border-color: transparent;
      outline: 2px solid var(--amber);
      outline-offset: 1px;
    }

    textarea { min-height: 88px; resize: vertical; }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 11px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: transform .12s ease, background .12s ease, opacity .12s ease;
    }

    button:active { transform: scale(.97); }
    button:disabled { cursor: wait; opacity: .55; }

    .btn-secure, .btn-primary {
      background: var(--amber);
      color: #3A2508;
    }

    .btn-secure:hover, .btn-primary:hover { background: var(--amber-dark); }

    .claimed-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      padding: 11px 12px;
      border-radius: 11px;
      background: var(--rust-bg);
    }

    .stamp {
      color: var(--rust);
      font-family: "Fraunces", serif;
      font-size: 15px;
      font-weight: 700;
      transform: rotate(-1deg);
    }

    .stamp b { color: var(--teal-dark); }

    .empty, .loading, .error {
      padding: 44px 20px;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
    }

    .error { color: var(--rust); }

    .admin-toggle {
      display: block;
      margin: 28px auto 0;
      padding: 9px;
      background: none;
      color: var(--ink-soft);
      font-size: 12.5px;
      text-decoration: underline;
    }

    .admin-panel {
      margin-top: 18px;
      padding: 18px;
      border-radius: var(--radius);
      background: var(--teal-dark);
      color: #EFE9DC;
    }

    .admin-panel h4 {
      margin: 0 0 12px;
      color: #F4EFE4;
      font-size: 18px;
    }

    .admin-panel label {
      display: block;
      margin: 11px 0 5px;
      color: #C9DED9;
      font-size: 12px;
      font-weight: 700;
    }

    .admin-panel input, .admin-panel textarea {
      border-color: #2D5850;
      background: #163F38;
      color: #F4EFE4;
    }

    .admin-panel input::placeholder,
    .admin-panel textarea::placeholder { color: #9FC2BB; }

    .btn-primary { width: 100%; margin-top: 12px; }

    .admin-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .admin-head h4 { margin: 0; }

    .btn-logout {
      min-height: 36px;
      padding: 7px 10px;
      background: transparent;
      color: #C9DED9;
      font-size: 12px;
      text-decoration: underline;
    }

    .admin-list { margin-top: 22px; }

    .admin-list-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 11px 0;
      border-bottom: 1px solid #2D5850;
      font-size: 13.5px;
    }

    .admin-list-item > span:first-child { overflow-wrap: anywhere; }
    .admin-list-item .st { color: #9FC2BB; font-size: 12px; }

    .admin-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; }

    .icon-btn {
      min-height: 36px;
      padding: 5px 7px;
      background: none;
      color: #E2A87F;
      font-size: 12px;
      text-decoration: underline;
    }

    .lock-note {
      margin: 10px 0 0;
      color: #9FC2BB;
      font-size: 12px;
      line-height: 1.45;
    }

    .form-error {
      min-height: 20px;
      margin: 8px 0 0;
      color: #F4B2AC;
      font-size: 12px;
    }

    @media (max-width: 430px) {
      .claim-row { flex-direction: column; }
      .btn-secure { width: 100%; }
      .topic { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">BeGuNa · intern</p>
      <h1>Welches Thema<br>sicherst du dir?</h1>
      <p>Wähle ein Thema aus der Liste. Sobald du es sicherst, sehen alle anderen sofort, dass es vergeben ist.</p>
    </header>

    <main>
      <div id="topics" class="loading" aria-live="polite">Themen werden geladen …</div>
      <button class="admin-toggle" id="adminToggleBtn" type="button" aria-expanded="false">Backoffice</button>
      <div id="adminPanel" hidden></div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc,
      doc, serverTimestamp, runTransaction, deleteField
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import {
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
      setPersistence, browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPRhSkHQ3E1EP9W9xgqYzRjpuYIObpWDc",
      authDomain: "backstage-beguna.firebaseapp.com",
      projectId: "backstage-beguna",
      storageBucket: "backstage-beguna.firebasestorage.app",
      messagingSenderId: "7028261549",
      appId: "1:7028261549:web:7a1a05279091909610bc24"
    };

    const ADMIN_EMAIL = "team@backstage-beguna.app";
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const topicsCol = collection(db, "topics");

    let topics = [];
    let adminUnlocked = false;

    function escapeHtml(value) {
      const element = document.createElement("div");
      element.innerText = value || "";
      return element.innerHTML;
    }

    function mapsUrl(address) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
    }

    function showError(message) {
      const element = document.getElementById("topics");
      element.className = "error";
      element.textContent = message;
    }

    function formatTopicMeta(topic) {
      const rows = [];
      if (topic.deadline) {
        rows.push(`<div class="meta-row"><span class="meta-icon">⏱</span><span><strong>Zeitraum:</strong> ${escapeHtml(topic.deadline)}</span></div>`);
      }
      if (topic.storeName) {
        rows.push(`<div class="meta-row"><span class="meta-icon">🏪</span><span><strong>Laden:</strong> ${escapeHtml(topic.storeName)}</span></div>`);
      }
      if (topic.address) {
        rows.push(`<div class="meta-row"><span class="meta-icon">📍</span><span><strong>Adresse:</strong> <a href="${mapsUrl(topic.address)}" target="_blank" rel="noopener">${escapeHtml(topic.address)}</a></span></div>`);
      }
      return rows.length ? `<div class="meta">${rows.join("")}</div>` : "";
    }

    function renderTopics() {
      const element = document.getElementById("topics");
      if (!topics.length) {
        element.className = "empty";
        element.textContent = "Für heute sind noch keine Themen eingestellt.";
        renderAdmin();
        return;
      }

      element.className = "";
      element.innerHTML = topics.map((topic) => {
        const common = `
          <div class="topic-top">
            <h3>${escapeHtml(topic.title)}</h3>
            <span class="badge ${topic.status === "blockiert" ? "blockiert" : "frei"}">${topic.status === "blockiert" ? "Vergeben" : "Frei"}</span>
          </div>
          ${formatTopicMeta(topic)}
          ${topic.scriptText ? `<p class="script-label">Das sollst du sagen</p><p class="script-text">${escapeHtml(topic.scriptText)}</p>` : ""}`;

        if (topic.status === "blockiert") {
          return `<article class="topic">${common}<div class="claimed-block"><div class="stamp">Gesichert von <b>${escapeHtml(topic.claimedBy)}</b></div></div></article>`;
        }

        return `
          <article class="topic">
            ${common}
            <div class="claim-row">
              <input type="text" maxlength="60" autocomplete="name" placeholder="Dein Name" aria-label="Dein Name für ${escapeHtml(topic.title)}" id="name-${topic.id}">
              <button class="btn-secure" type="button" id="claim-${topic.id}" onclick="secureTopic('${topic.id}')">Sichern</button>
            </div>
          </article>`;
      }).join("");
      renderAdmin();
    }

    window.secureTopic = async function (id) {
      const input = document.getElementById(`name-${id}`);
      const button = document.getElementById(`claim-${id}`);
      const name = input.value.trim();

      if (name.length < 2) {
        input.focus();
        input.style.outline = "2px solid var(--rust)";
        return;
      }

      button.disabled = true;
      button.textContent = "Wird gesichert …";

      try {
        const topicRef = doc(db, "topics", id);
        await runTransaction(db, async (transaction) => {
          const snapshot = await transaction.get(topicRef);
          if (!snapshot.exists() || snapshot.data().status !== "frei") {
            throw new Error("already-claimed");
          }
          transaction.update(topicRef, {
            status: "blockiert",
            claimedBy: name,
            claimedAt: serverTimestamp()
          });
        });
      } catch (error) {
        console.error(error);
        if (error.message === "already-claimed") {
          alert("Dieses Thema wurde gerade von jemand anderem gesichert.");
        } else {
          alert("Das Sichern hat nicht geklappt. Bitte versuche es erneut.");
        }
        button.disabled = false;
        button.textContent = "Sichern";
      }
    };

    window.releaseTopic = async function (id) {
      try {
        await updateDoc(doc(db, "topics", id), {
          status: "frei",
          claimedBy: "",
          claimedAt: deleteField()
        });
      } catch (error) {
        console.error(error);
        alert("Das Freigeben hat nicht geklappt.");
      }
    };

    window.deleteTopic = async function (id) {
      if (!confirm("Dieses Thema wirklich löschen?")) return;
      try {
        await deleteDoc(doc(db, "topics", id));
      } catch (error) {
        console.error(error);
        alert("Das Löschen hat nicht geklappt.");
      }
    };

    window.addTopic = async function () {
      const fields = {
        title: document.getElementById("newTitle"),
        deadline: document.getElementById("newDeadline"),
        scriptText: document.getElementById("newScript"),
        storeName: document.getElementById("newStore"),
        address: document.getElementById("newAddress")
      };
      const values = Object.fromEntries(Object.entries(fields).map(([key, element]) => [key, element.value.trim()]));

      if (!values.title) return fields.title.focus();
      if (!values.deadline) return fields.deadline.focus();
      if (!values.scriptText) return fields.scriptText.focus();

      const button = document.getElementById("addTopicBtn");
      button.disabled = true;
      button.textContent = "Wird hinzugefügt …";

      try {
        await addDoc(topicsCol, {
          ...values,
          status: "frei",
          claimedBy: "",
          createdAt: serverTimestamp()
        });
        Object.values(fields).forEach((field) => { field.value = ""; });
      } catch (error) {
        console.error(error);
        alert("Das Thema konnte nicht angelegt werden.");
      } finally {
        button.disabled = false;
        button.textContent = "Thema hinzufügen";
      }
    };

    window.unlockAdmin = async function () {
      const passwordElement = document.getElementById("adminPw");
      const errorElement = document.getElementById("adminError");
      const button = document.getElementById("unlockBtn");
      const password = passwordElement.value;

      if (!password) return passwordElement.focus();
      button.disabled = true;
      errorElement.textContent = "";

      try {
        await setPersistence(auth, browserSessionPersistence);
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL, password);
      } catch (error) {
        console.error(error);
        passwordElement.value = "";
        errorElement.textContent = "Passwort nicht korrekt. Bitte erneut versuchen.";
        button.disabled = false;
      }
    };

    window.logoutAdmin = async function () {
      await signOut(auth);
    };

    function renderAdmin() {
      const panel = document.getElementById("adminPanel");
      if (panel.hidden) return;

      if (!adminUnlocked) {
        panel.innerHTML = `
          <section class="admin-panel">
            <h4>Backoffice-Zugang</h4>
            <label for="adminPw">Gemeinsames Passwort</label>
            <input type="password" id="adminPw" autocomplete="current-password" placeholder="Passwort eingeben">
            <button class="btn-primary" id="unlockBtn" type="button" onclick="unlockAdmin()">Entsperren</button>
            <p class="form-error" id="adminError" role="alert"></p>
            <p class="lock-note">Das Passwort wird sicher über Firebase geprüft und nicht im Website-Code gespeichert.</p>
          </section>`;
        document.getElementById("adminPw").addEventListener("keydown", (event) => {
          if (event.key === "Enter") window.unlockAdmin();
        });
        return;
      }

      panel.innerHTML = `
        <section class="admin-panel">
          <div class="admin-head">
            <h4>Neues Thema</h4>
            <button class="btn-logout" type="button" onclick="logoutAdmin()">Abmelden</button>
          </div>

          <label for="newTitle">Titel *</label>
          <input type="text" id="newTitle" maxlength="120" placeholder="Titel des Themas">

          <label for="newDeadline">Zeitraum / Frist *</label>
          <input type="text" id="newDeadline" maxlength="120" placeholder="z. B. heute bis 16:00 Uhr">

          <label for="newScript">Text, der gesagt werden soll *</label>
          <textarea id="newScript" maxlength="1500" placeholder="Sprechtext eingeben"></textarea>

          <label for="newStore">Laden (optional)</label>
          <input type="text" id="newStore" maxlength="120" placeholder="Name des Ladens">

          <label for="newAddress">Adresse (optional)</label>
          <input type="text" id="newAddress" maxlength="240" placeholder="Straße, Hausnummer, Ort">

          <button class="btn-primary" id="addTopicBtn" type="button" onclick="addTopic()">Thema hinzufügen</button>

          <div class="admin-list">
            <h4>Alle Themen verwalten</h4>
            ${topics.map((topic) => `
              <div class="admin-list-item">
                <span>${escapeHtml(topic.title)} <span class="st">· ${topic.status === "blockiert" ? escapeHtml(topic.claimedBy) : "frei"}</span></span>
                <span class="admin-actions">
                  ${topic.status === "blockiert" ? `<button class="icon-btn" type="button" onclick="releaseTopic('${topic.id}')">Freigeben</button>` : ""}
                  <button class="icon-btn" type="button" onclick="deleteTopic('${topic.id}')">Löschen</button>
                </span>
              </div>`).join("") || `<p class="lock-note">Noch keine Themen vorhanden.</p>`}
          </div>
        </section>`;
    }

    document.getElementById("adminToggleBtn").addEventListener("click", () => {
      const panel = document.getElementById("adminPanel");
      const button = document.getElementById("adminToggleBtn");
      panel.hidden = !panel.hidden;
      button.setAttribute("aria-expanded", String(!panel.hidden));
      if (!panel.hidden) renderAdmin();
    });

    onAuthStateChanged(auth, (user) => {
      adminUnlocked = user?.email?.toLowerCase() === ADMIN_EMAIL;
      renderAdmin();
    });

    onSnapshot(topicsCol, (snapshot) => {
      topics = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
      topics.sort((a, b) => {
        const aTime = a.createdAt?.seconds || 0;
        const bTime = b.createdAt?.seconds || 0;
        return aTime - bTime;
      });
      renderTopics();
    }, (error) => {
      console.error(error);
      showError("Die Verbindung zur Themenliste ist noch nicht freigeschaltet. Bitte die Firestore-Regeln einrichten.");
    });
  </script>
</body>
</html>
